<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body id="fondo" class="auth-layout">

  <main class="card">
    <header class="card-header">
      <h1>Crear Cuenta</h1>
      <p>Ingresa tus datos para el registro</p>
    </header>

    <div id="message" class="msg" style="display: none;"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Nombre de usuario</label>
        <input type="text" id="name" placeholder="Minimo 6 caracteres" minlength="6" required>
      </div>

      <div class="form-group">
        <label for="email">Correo electronico</label>
        <input type="email" id="email" placeholder="tu@correo.com" required>
      </div>

      <div class="form-group">
        <label for="itsonId">ITSON ID (6 digitos)</label>
        <input type="text" id="itsonId" placeholder="Ej. 256762" pattern="[0-9]{6}" maxlength="6" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Minimo 6 caracteres" minlength="6" required>
      </div>

      <button type="submit" class="btn">Registrarse</button>
    </form>

    <footer class="auth-links">
      <p>¿Ya estas registrado? <a href="login.html">Inicia sesion</a></p>
    </footer>
  </main>

  <script src="app.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.fog.min.js"></script>

  <script src="vanta.fog.min.js"></script>
  <script>
  VANTA.FOG({
    el: "#fondo",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 200.00,
    minWidth: 200.00,
    blurFactor: 0.90,
    speed: 2.50,
    zoom: 0.50,
    highlightColor: 0x2563eb,
    midtoneColor: 0x2563eb,
    lowlightColor: 0xf8fafc,
    baseColor: 0xf8fafc
  })
  </script>
</body>
</html>
